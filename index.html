<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Sophie's Mind Map</title>
    <link rel="stylesheet" href="02style.css"> <!-- Link to the CSS file -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"> <!-- VHS font -->
</head>
<body>
    <div id="login">
        <h2>Please enter the password:</h2>
        <input type="password" id="passwordInput" placeholder="Password">
        <button id="submitButton" onclick="checkPassword()">Submit</button>
        <p id="errorMessage"></p>
    </div>

    <div id="content" style="display: none;">
        <h1 id="mainHeader" class="draggable">Welcome to Sophie's Mind Map</h1>
        <div id="navButtons" class="draggable">
            <button onclick="location.href='02gallery.html'">Gallery</button>
            <button onclick="location.href='03entries.html'">Entries</button>
        </div>
        <div id="contactInfo" class="draggable">
            <p>Phone: 250-551-0615</p>
        </div>
        <img src="imgfuji.jpeg" id="fujiImg" class="draggable" alt="Image of Fuji">
        <img src="imgspain.jpeg" id="spainImg" class="draggable" alt="Image of Spain">
    </div>

    <script src="03java.js"></script> <!-- JavaScript -->
    <script src="04drag.js"></script> <!-- Drag-and-drop JavaScript -->
</body>
</html>
